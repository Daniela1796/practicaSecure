<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SecureLink — Registro</title>
    <meta
      name="description"
      content="Interfaz de inicio de sesión accesible e inclusiva para Banco SecureLink."
    />
    <link rel="icon" type="image/svg+xml" href="../assets/img/LogoHeader.svg" /> 

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/styles\styleRegister.css" rel="stylesheet" /> 
  </head>
  <body>
    <header
      class="p-3 custom-header text-white d-flex justify-content-between align-items-center"
      role="banner"
    >
      <a
        href="../index.html"
        class="d-flex align-items-center text-white text-decoration-none"
        aria-label="Ir a la página de inicio de Banco SecureLink"
      >
        <img
          src="../assets/img/LogoSL.png"
          alt="Logo SecureLink"
          width="180"
          class="me-2"
        />
      </a>
      <div class="position-relative">
        <button
          class="accessibility-toggle"
          onclick="toggleAccessibilityModal()"
          aria-controls="accessibilityModal"
          aria-expanded="false"
          aria-label="Abrir menú de accesibilidad"
        >
          <img
            src="../assets/img/accesibilidad.png"
            alt="Icono de accesibilidad"
            width="24"
          />
          Accesibilidad
        </button>
        <div id="accessibilityModal" class="accessibility-modal">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0">Accesibilidad</h6>
            <div
              role="button"
              class="close-btn"
              aria-label="Cerrar menú de accesibilidad"
              onclick="toggleAccessibilityModal()"
            >
              <span>&times;</span>
            </div>
          </div>
          <button
            class="btn btn-outline-custom w-100 mb-2"
            onclick="toggleHighContrast()"
          >
            Contraste alto
          </button>
          <button
            class="btn btn-outline-custom w-100 mb-2"
            onclick="toggleLowContrast()"
          >
            Contraste bajo
          </button>
          <div class="d-flex gap-2 mb-2">
            <button
              class="btn btn-outline-custom flex-fill"
              onclick="increaseFont()"
              aria-label="Aumentar tamaño de fuente"
            >
              A+
            </button>
            <button
              class="btn btn-outline-custom flex-fill"
              onclick="decreaseFont()"
              aria-label="Disminuir tamaño de fuente"
            >
              A-
            </button>
          </div>
        </div>
      </div>
    </header>

    <nav class="navbar navbar-light bg-light border-bottom shadow-sm">
      <div class="container-fluid d-flex justify-content-center">
        <a
          class="btn btn-accesible"
          type="button"
          href="../index.html"

          aria-label="Volver a la página principal"
          role="button"
        >
          Volver al inicio
        </a>
      </div>
    </nav>
    <main class="container py-5">
      <div class="register-card row g-4 align-items-center">
        <div class="col-md-6">
          <h1 id="titulo" class="h3">Registro de la plataforma</h1>
          <p class="text-muted">
            Plataforma segura, accesible e inclusiva para gestionar tu cuenta.
          </p>
          <ul class="small">
            <li>Contamos con opciones de acceseibilidad.</li>
            <li>
              Soporte para lectores de pantalla con etiquetas y descripciones.
            </li>
          </ul>
        </div>
        <div class="col-md-6">
          <form id="RegisterForm" novalidate>
            <div class="mb-3">
              <label for="usuario" class="form-label"
                >Nombre completo</label
              >
              <input
                type="text"
                class="form-control"
                id="nombre"
                name="Nombre"
                placeholder="Nombres y apellidos"
                required
              />
            </div>
            <div class="mb-3">
              <label for="correo" class="form-label"
                >Correo electrónico</label
              >
              <input
                type="text"
                class="form-control"
                id="correo"
                name="Correo electrónico"
                placeholder="ejemplo@correo.com "
                required
                aria-describedby="correo no válido"
              />
            </div>
            <div class="mb-3">
              <label for="clave" class="form-label">Contraseña</label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="clave"
                  name="clave"
                  required
                  aria-describedby="errorClave"
                />
                <button
                  type="button"
                  class="btn btn-outline-custom"
                  id="togglePwd"
                  aria-controls="clave"
                  aria-label="Mostrar/ocultar contraseña"
                >
                  Mostrar
                </button>
              </div>
              <div id="errorClave" class="error" aria-live="polite"></div>
            </div>
            <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
  <label for="rol" class="form-label mb-0">Rol:</label>
  <select id="rol" name="userRol" class="form-select w-auto">
    <option value="" selected>Selecciona un rol</option>
    <option value="admin">Administrador</option>
    <option value="cliente">Cliente</option>
    <option value="vendedor">Vendedor</option>
  </select>
  <div id="errorUsuario" class="error" role="alert" aria-live="polite"></div>
</div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="TYC" />
                <label class="form-check-label" for="TYC"
                  >Acepto los  <a href="/terminos" target="_blank">términos y condiciones</a></label
                >
                <p></p>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-custom">
                Registrate
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/script/scriptRegister.js"></script>

  </body>
</html>
